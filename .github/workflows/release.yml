# push main / 打 v* tag / 手动触发 → 质量门禁 → 构建 release APK。
# 产物只上传最终 APK（不传 AAB、mapping 或其它中间物）。
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p signing
            printf '%s' "$KS_B64" | base64 -d > signing/autop-release.jks
            printf 'storeFile=signing/autop-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > keystore.properties
            echo "release keystore restored（产物将带正式签名）"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置，构建未签名 release 包"
          fi

      - name: Quality gate (test / detekt / ktlint)
        run: ./gradlew test detekt ktlintCheck --console=plain

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature (when signed)
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          apksigner verify --print-certs "$apk" | head -4 || echo "::warning::未签名包（缺 secrets）"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
