# push main / 打 v* tag / 手动触发 → 质量门禁 → 构建 release APK。
# 产物只上传最终 APK（不传 AAB、mapping 或其它中间物）。
name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# 只有发布 Release 需要写权限；其余步骤都只读代码。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # 不引第三方 setup-android（首跑在该步失败；Ubuntu 26 新镜像 + node20 老动作被强制
      # 跑 node24 是嫌疑点，且日志接口要 admin 才能读）。镜像自带 SDK，缺的
      # platform/build-tools（android-37.0 这类小版本平台包名也在变）交给 AGP 自动下载。
      - name: Check Android SDK
        run: |
          if [ -z "${ANDROID_HOME:-}" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "::error::runner 缺少 ANDROID_HOME（镜像未预装 Android SDK）"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME"

      - name: Restore release keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p signing
            printf '%s' "$KS_B64" | base64 -d > signing/autop-release.jks
            printf 'storeFile=signing/autop-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KS_ALIAS" "$KEY_PASS" > keystore.properties
            echo "release keystore restored（产物将带正式签名）"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置，构建未签名 release 包"
          fi

      - name: Quality gate (test / detekt / ktlint)
        run: |
          ./gradlew test detekt ktlintCheck --console=plain \
            || { echo "::error::质量门禁未过（test/detekt/ktlint），见 run 日志"; exit 1; }

      - name: Build release APK
        run: |
          ./gradlew :app:assembleRelease --console=plain \
            || { echo "::error::assembleRelease 失败，见 run 日志"; exit 1; }

      - name: Verify signature (when signed)
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          bin=$(command -v apksigner || ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -n1 || true)
          if [ -n "$bin" ]; then
            "$bin" verify --print-certs "$apk" | head -4 || echo "::warning::未签名包（缺 secrets）或校验失败"
          else
            echo "::warning::apksigner 不可用，跳过签名校验"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # 打 v* tag 时把 APK 发布到该 tag 的 GitHub Release（安装包统一从 Releases 下载）。
      # 已存在同名 Release（重跑）时只替换附件；没有签名密钥时附件为未签名包，Release 标为预发布。
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          cp "$apk" app-release.apk
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" app-release.apk --clobber
          else
            flag=""
            [ "$SIGNED" = "true" ] || flag="--prerelease"
            gh release create "$GITHUB_REF_NAME" app-release.apk --title "$GITHUB_REF_NAME" --generate-notes $flag
          fi
